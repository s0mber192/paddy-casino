services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/"
    container_name: paddy-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${PADDY_DATA_DIR:?Set PADDY_DATA_DIR to the existing database directory}:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: paddy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
